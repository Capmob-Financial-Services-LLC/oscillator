# CANONICAL — do not edit this file in an app repo.
#
# The copy in every repo's .github/workflows/ is written from this one by
# infra/scripts/sync-claude-workflows.sh. Edit here, run the script, review the
# PRs it opens. A hand-edit in an app repo is reverted by the next sync.
#
# The on-demand counterpart to claude-review.yml. That one only ever comments.
# This is where a human asks for the change: write "@claude ..." in a PR
# comment, a review comment, or an issue, and Claude does the work and pushes
# the commit to that PR's own branch. Nothing here runs unasked.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Serialise per thread. Two "@claude fix it" comments in a row must not race
# each other into two conflicting commits on the same branch, so this queues
# rather than cancels — cancelling could kill a run mid-push.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  # write, unlike claude-review.yml: this one commits the fix to the PR branch.
  contents: write
  pull-requests: write
  issues: write
  # Same OIDC exchange claude-review.yml needs. Without it the action fails in
  # setupGitHubToken before Claude starts.
  id-token: write
  # Lets Claude read CI logs, so "@claude why is CI red" can actually answer.
  actions: read

jobs:
  claude:
    # Two gates, both required.
    #
    # 1. The trigger phrase appears in the body. Without this, every comment on
    #    every issue starts a run.
    # 2. The author can write to this repo. The phrase is attacker-controlled
    #    text and this job holds `contents: write`, so a drive-by commenter
    #    must not be able to spend it. author_association is GitHub's own
    #    answer to "may this person push here".
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for the same supply-chain reason as claude-review.yml.
      # fetch-depth 0, unlike the review: this one commits, and a shallow clone
      # cannot push a branch back.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          # This resolves to a REPO secret, not the org one. On the GitHub free
          # plan an organization secret does not reach private repositories —
          # the org secret is set to visibility "all" and works in oscillator,
          # the one public repo, while every private repo expands it to "" and
          # the run dies with "Environment variable validation failed". If that
          # error appears here, the repo is missing its own copy of the secret:
          # run infra/scripts/set-claude-secret.sh (--check to see who has it).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # NOTHING here grants the ability to edit or push. Tag mode already
          # gives Claude Read/Glob/Grep/LS, `Bash(git add|commit|rm)`, the
          # action's git-push wrapper, and `--permission-mode acceptEdits`,
          # which auto-allows file writes inside the workspace and denies them
          # outside it. Verified: repeated `--allowedTools` flags ACCUMULATE
          # (the action emits its own list, then appends this one), so the list
          # below adds to those defaults rather than replacing them.
          #
          # What it adds is the per-stack check commands, because the repos
          # differ: pnpm at the root in capmob-web/cms/CRM/CAPBoard, Python in
          # BSA and Capmob-AI, Go under capmob-web/services, Terraform in infra.
          # A union is right here — an absent runner is simply never invoked.
          #
          # This is deliberately a curated list and NOT blanket `Bash`. The
          # gate above controls who may *trigger* a run, but the PR title, body
          # and diff Claude then reads are written by whoever opened the PR —
          # and `oscillator` is public. A bounded tool list is what keeps a
          # malicious PR body from turning a collaborator's "@claude fix this"
          # into arbitrary code execution with `contents: write`.
          #
          # terraform fmt/validate only: plan and apply need AWS credentials
          # and take a state lock.
          claude_args: |
            --allowedTools "Bash(pnpm:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(uv:*),Bash(pip:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(gofmt:*),Bash(make:*),Bash(terraform fmt:*),Bash(terraform validate:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*)"
            --append-system-prompt "Read this repo's CLAUDE.md first and follow it; it names the stack, the commands, and the non-negotiables. Before you commit, run whatever that repo uses for typecheck, lint and tests, and report what they said in your reply. If a check fails, say so and do not push — a red commit on someone's PR costs them more than a slow answer. If the request is ambiguous, ask in a comment instead of guessing at an implementation. Commit to the PR's existing branch; never open a new PR for a fix that was asked for on an existing one."
