# CANONICAL — do not edit this file in an app repo.
#
# The copy in every repo's .github/workflows/ is written from this one by
# infra/scripts/sync-claude-workflows.sh. Edit here, run the script, review the
# PRs it opens. A hand-edit in an app repo is reverted by the next sync, and so
# is a Dependabot bump of the action pins below: bump them here, deliberately.
#
# It has to be a copy in each repo rather than a reusable workflow called from
# one place: the action validates server-side that the workflow file matches
# the repo's default branch, and with `workflow_call` the file that runs the
# action lives in another repo. Whether that passes validation is decided at
# api.anthropic.com and is not knowable from the action's source, so a
# reusable workflow risks silently skipping every run in every repo.
# Org-level required workflows would be the real answer; they need GitHub
# Enterprise Cloud and this org is on free.
#
# What this workflow guarantees:
#
#   1. ONE reviewer, ONE thread. `use_sticky_comment` keeps a single Claude
#      summary comment per PR and rewrites it on every push, instead of
#      stacking a new "Claude finished" comment per commit.
#   2. ONLY THE LATEST CHANGES. A push reviews the commits it added, not the
#      whole PR again. The first review of a PR, a reopen, a draft marked
#      ready, and a force-push (where "what changed since last time" has no
#      meaning) get a full review.
#   3. ONLY THE LATEST RUN. A new push cancels a review still running for the
#      previous commit, and no review can run longer than 30 minutes.
#   4. A VERDICT THAT GATES. Claude returns a structured verdict; "request
#      changes" fails this check, so a PR with blocking findings shows red
#      rather than green-with-a-comment. (Branch protection cannot REQUIRE it
#      on the free plan for private repos; a red check is the gate we have.)

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  # REQUIRED. The action does not use GITHUB_TOKEN: it mints a GitHub App
  # token by exchanging this workflow's OIDC token. Without `id-token: write`
  # that exchange fails in setupGitHubToken, three retries deep, before Claude
  # is ever started — "Could not fetch an OIDC token".
  id-token: write
  # Lets the review read the PR's other check runs, so it can say which CI job
  # failed and why instead of reviewing blind next to a red X.
  actions: read

jobs:
  review:
    # Same-repo only: `oscillator` is public, and GitHub does not grant
    # `id-token: write` to a fork's pull_request run, so such a run cannot
    # work. Bots (dependabot and the rest) and drafts are skipped.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to commit SHAs, not tags: a tag can be repointed by its owner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Decide what this run reviews. Event values reach the shell through
      # env, never by ${{ }} interpolation into the script.
      - name: Scope the review
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          mode=full
          from="$BASE"
          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # "ahead" = AFTER is BEFORE plus new commits. Anything else
            # (diverged, a force-push) leaves no meaningful increment.
            status=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq .status 2>/dev/null || echo unknown)
            if [ "$status" = "ahead" ]; then
              mode=incremental
              from="$BEFORE"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "Review mode: $mode ($from...$AFTER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          # A REPO secret, not the org one: on the free plan an organization
          # secret does not reach private repositories. If this run dies with
          # "Environment variable validation failed", the repo is missing its
          # own copy: run infra/scripts/set-claude-secret.sh.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # One tracking comment per PR, filled in as the review runs and
          # rewritten on the next push. Findings land as inline comments on
          # the offending lines, each with a "Fix this" link.
          track_progress: true
          use_sticky_comment: true

          # The process lives here; the standard lives in each repo's
          # CLAUDE.md. A marketing site and a Terraform repo need different
          # rules, and this prompt deliberately names none of them.
          prompt: |
            You are the senior engineer who signs off this PR before it can
            ship to production. Be strict, specific and terse. Your job is to
            stop defects reaching main, not to be encouraging.

            Repository: ${{ github.repository }}   PR: #${{ github.event.pull_request.number }}
            Review mode: ${{ steps.scope.outputs.mode }}
            Review range: ${{ steps.scope.outputs.from }}...${{ github.event.pull_request.head.sha }}

            ## Scope
            - mode=full: review the whole PR (`gh pr diff`).
            - mode=incremental: review ONLY the commits in the review range:
              `gh api repos/${{ github.repository }}/compare/${{ steps.scope.outputs.from }}...${{ github.event.pull_request.head.sha }}`.
              Read the full PR diff for context, but raise findings only on
              lines this range changed, or on earlier findings it failed to fix.
            - Either way, first read your own earlier inline comments:
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
              (author claude[bot]). Never repeat one. If the new commits fix
              an earlier finding, list it under "Resolved". If an earlier
              blocking finding is still unfixed, it stays blocking.

            ## Before judging
            1. Read CLAUDE.md, and ARCHITECTURE.md / DESIGN.md / PERFORMANCE.md
               if present. They are the standard; a violation of a stated
               rule there is blocking.
            2. Open enough of each changed file to judge the change in
               context. A hunk alone hides most bugs.
            3. Run `gh pr checks`. If a check is failing, read its log
               (`gh run view`) and report the cause; do not review around it.

            ## Blocking (request changes) — any one of these
            - Correctness: wrong logic, off-by-one, broken edge cases (empty,
              null, zero, huge, unicode, timezones, concurrency), unhandled
              errors on I/O, network or external calls.
            - Security: authn/authz gaps or IDOR, injection (SQL, shell,
              template, prompt), SSRF, path traversal, unsafe deserialization,
              secrets or tokens in code or logs, PII or financial data logged
              or exposed, missing input validation at a trust boundary, CORS,
              cookie or CSRF weakening, GitHub Actions expressions
              interpolated into `run:`.
            - Data: destructive or non-reversible migrations, migrations that
              break the currently deployed code, lost writes, unbounded queries
              or N+1 on hot paths, missing transactions where partial writes
              corrupt state.
            - Contracts: a breaking API, schema, event or config change without
              a migration path for its callers.
            - Tests: new or changed behaviour with no test exercising it, or a
              test weakened or deleted to make CI pass.
            - Operations: CI checks, linters or security scans disabled or
              loosened; IAM, network or bucket exposure widened; a new
              dependency that is unpinned, unmaintained or unjustified;
              anything that cannot be rolled back.

            Everything else (naming, style, small refactors, docs) is
            non-blocking and must be labelled `nit:`.

            ## Evidence
            Every finding needs its proof: the caller that passes the bad
            value, the input that reaches the sink, the branch never taken.
            If you cannot ground it in this code, drop it. No speculation, no
            generic advice, no restating the diff, no praise.

            ## Output
            - One inline comment per finding, on the exact line, starting with
              one of `bug:` `security:` `data:` `contract:` `test:` `perf:`
              `ops:` `nit:`, saying what is wrong, why, and the concrete fix.
            - A summary comment: one line on what the PR does, the review mode,
              then the lists "Blocking", "Non-blocking", "Resolved". If there
              is nothing blocking, say so in one line.
            - Finally return the structured verdict: `request_changes` if
              anything is blocking (including unfixed earlier blocking
              findings), else `approve`.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh api:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"blocking_count":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["verdict","blocking_count","summary"],"additionalProperties":false}'

      # The gate. A missing verdict (the action failed to produce one) is a
      # warning, not a failure: an outage of the reviewer must not block every
      # PR in the org. A verdict of request_changes fails the check.
      - name: Enforce the verdict
        if: always() && steps.claude.outcome == 'success'
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::warning::Claude returned no verdict; the review comments still apply."
            exit 0
          fi
          verdict=$(printf '%s' "$RESULT" | jq -r '.verdict // empty')
          count=$(printf '%s' "$RESULT" | jq -r '.blocking_count // 0')
          printf '%s' "$RESULT" | jq -r '"### Claude verdict: \(.verdict) (\(.blocking_count) blocking)\n\n\(.summary)"' >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" = "request_changes" ]; then
            echo "::error::Claude requested changes: $count blocking finding(s). See the review comments on this PR."
            exit 1
          fi
