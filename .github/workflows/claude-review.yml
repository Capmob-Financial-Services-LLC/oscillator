# CANONICAL — do not edit this file in an app repo.
#
# The copy in every repo's .github/workflows/ is written from this one by
# infra/scripts/sync-claude-review.sh. Edit here, run the script, review the
# PRs it opens. A hand-edit in an app repo is reverted by the next sync.
#
# It has to be a copy in each repo rather than a reusable workflow called from
# one place: the action validates server-side that the workflow file matches
# the repo's default branch, and with `workflow_call` the file that runs the
# action lives in another repo. Whether that passes validation is decided at
# api.anthropic.com and is not knowable from the action's source, so a
# reusable workflow risks silently skipping every run in every repo.
# Org-level required workflows would be the real answer; they need GitHub
# Enterprise Cloud and this org is on free.

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR at a time. Pushing again mid-review supersedes the run it
# would otherwise race, so a reviewer never sees two half-written passes over
# two different commits sitting in the same thread.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  # REQUIRED. The action does not use GITHUB_TOKEN: it mints a GitHub App
  # token by exchanging this workflow's OIDC token. Without `id-token: write`
  # that exchange fails in setupGitHubToken, three retries deep, before Claude
  # is ever started — "Could not fetch an OIDC token". Every copy of this
  # workflow in the org was missing it, and every run in every repo had failed
  # that way since the day it was added.
  id-token: write
  # Lets the review read the PR's other check runs, so it can say which CI job
  # failed and why instead of reviewing blind next to a red X.
  actions: read

jobs:
  review:
    # Three gates.
    #
    # Same-repo only: `oscillator` is public, so a PR can come from a fork.
    # GitHub does not grant `id-token: write` to a fork's pull_request run, so
    # such a run cannot work — skip cleanly rather than fail red on every
    # outside contribution. (Reviewing fork PRs needs pull_request_target and
    # a different security argument; not worth it until someone forks.)
    #
    # Bots: dependabot PRs are lockfile diffs. A review spends quota to say
    # nothing, and they are ~11% of this org's PR volume.
    #
    # Drafts are still being written.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not the v4/v1 tag: a mutable tag can be
      # silently repointed by the action owner (supply-chain risk semgrep's
      # github-actions-mutable-action-tag rule blocks on), so CI resolves
      # exactly this commit regardless of what the tag points to later.
      # Bump deliberately by re-resolving the tag to its current SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          # This resolves to a REPO secret, not the org one. On the GitHub free
          # plan an organization secret does not reach private repositories —
          # the org secret is set to visibility "all" and works in oscillator,
          # the one public repo, while every private repo expands it to "" and
          # the run dies with "Environment variable validation failed". If that
          # error appears here, the repo is missing its own copy of the secret:
          # run infra/scripts/set-claude-secret.sh (--check to see who has it).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Tag mode: one tracking comment that fills in as the review runs,
          # rather than silence and then a wall of text. Findings land as
          # inline comments on the offending lines; each carries a "Fix this"
          # link (include_fix_links, on by default) that opens Claude Code
          # locally with the finding as context — that is the fix hand-off.
          # Nothing here pushes a commit; see claude.yml for the opt-in path.
          track_progress: true

          # Deliberately says nothing about what this particular repo is. Each
          # repo's own CLAUDE.md carries its stack and its rules, and they
          # differ sharply — a marketing site's three-breakpoint requirement is
          # noise in the Terraform repo. This prompt is the process; CLAUDE.md
          # is the standard.
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Read this repo's CLAUDE.md first and follow it — it defines the
            stack, the non-negotiables, and (in some repos) a "PR Review
            Guidelines" section saying exactly what to comment on and what to
            leave alone. If the repo has ARCHITECTURE.md, DESIGN.md or
            PERFORMANCE.md, they hold constraints a change can silently break.

            How to work through it:

            1. Read the diff (`gh pr diff`). For each changed file, open enough
               of the surrounding file to judge the change in context — a hunk
               alone hides most bugs.
            2. Check the PR's other checks (`gh pr checks`). If one is failing,
               read its log and say what broke; do not review around it.
            3. Weigh each change against what the repo says about itself rather
               than a generic checklist. Look hardest at correctness, security,
               unhandled edge cases, and test coverage for the changed lines.
            4. Before writing a finding, look for the evidence that it is real:
               the caller that passes the bad value, the branch that is never
               taken, the input that is never validated. Drop anything you
               cannot ground that way.

            Post each surviving finding as an inline comment on the line it
            concerns, opening with one of `bug:`, `perf:`, `a11y:`,
            `security:`, `test:` or `nit:`. Reserve `nit:` for things that do
            not need to change before merge.

            Finish with a short top-level summary: what the PR does, then
            "Blocking" and "Non-blocking" lists naming the findings. If nothing
            is wrong, say so in one line — do not invent findings to look
            useful, and do not restate the diff back at the author.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh api:*)"
