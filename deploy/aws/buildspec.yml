version: 0.2

# CD to AWS: run by the `oscillator-cd` CodeBuild project (infra,
# live/prod/160-oscillator) on every push to main. Builds two Lambda bundles
# and updates the functions in place:
#
#   oscillator-web  the Next.js server (standalone output) + run script
#   oscillator-api  the FastAPI app + its dependencies for linux/arm64
#
# Both functions use the Lambda Web Adapter layer, so the same servers that
# run locally run on Lambda: no handler code. Arm64 throughout (the image and
# the functions), so the Python wheels built here are the ones Lambda loads.
#
# Database migrations are NOT run here: the hourly sync workflow already runs
# `alembic upgrade head` before each sync, and CodeBuild cannot reach Neon any
# faster than that.

env:
  variables:
    WEB_FUNCTION: oscillator-web
    API_FUNCTION: oscillator-api

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
  build:
    on-failure: ABORT
    commands:
      - echo "── web ──"
      - cd "$CODEBUILD_SRC_DIR/frontend"
      - npm ci --no-audit --no-fund
      - NEXT_OUTPUT=standalone npx next build
      - mkdir -p /tmp/web/.next
      - cp -r .next/standalone/. /tmp/web/
      - cp -r .next/static /tmp/web/.next/static
      - if [ -d public ]; then cp -r public /tmp/web/public; fi
      - cp "$CODEBUILD_SRC_DIR/deploy/aws/web-run.sh" /tmp/web/run.sh && chmod +x /tmp/web/run.sh
      - (cd /tmp/web && zip -qr /tmp/web.zip .)
      - echo "── api ──"
      - cd "$CODEBUILD_SRC_DIR/backend"
      - >-
        pip install --quiet -r requirements.txt --target /tmp/api
        --platform manylinux2014_aarch64 --implementation cp
        --python-version 3.12 --only-binary=:all:
      - cp -r app alembic alembic.ini /tmp/api/
      - cp "$CODEBUILD_SRC_DIR/deploy/aws/api-run.sh" /tmp/api/run.sh && chmod +x /tmp/api/run.sh
      - (cd /tmp/api && zip -qr /tmp/api.zip .)
      - ls -lh /tmp/web.zip /tmp/api.zip
  post_build:
    on-failure: ABORT
    commands:
      # post_build runs even when build failed unless told otherwise; the
      # check below keeps a failed build from shipping a half-built bundle.
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - aws lambda update-function-code --function-name "$WEB_FUNCTION" --zip-file fileb:///tmp/web.zip --publish --query Version --output text
      - aws lambda update-function-code --function-name "$API_FUNCTION" --zip-file fileb:///tmp/api.zip --publish --query Version --output text
      - aws lambda wait function-updated-v2 --function-name "$WEB_FUNCTION"
      - aws lambda wait function-updated-v2 --function-name "$API_FUNCTION"
